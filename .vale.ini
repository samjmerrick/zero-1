# Prose linting for site copy and docs. Run: vale sync && vale src/content docs
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = write-good
Vocab = Zero1

[*.{md,mdx,yaml,html,astro}]
BasedOnStyles = Vale, write-good, British, Human
Vale.Spelling = NO
write-good.E-Prime = NO
write-good.Passive = NO
